name: wheels

# Release wheels only: tags and manual runs. macOS minutes bill at 10x, so the
# full platform matrix stays off the per-push path — ci.yml covers that on Linux.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: macos-14
            target: aarch64
          - os: macos-13
            target: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # One abi3 wheel per platform covers Python 3.10 through 3.14.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: auto
          sccache: true

      # M0/M8 exit: installs and imports with no Rust toolchain, on the oldest
      # and newest supported Python — the same wheel for both.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install --find-links dist zstream pytest && pytest -q

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install --find-links dist zstream pytest && pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist
